<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Atafi Jr</title>
    <link rel="stylesheet" href="Services.css">
</head>
<body>

<section class="services">

    <h1 class="section-title">My Services</h1>

    <div class="services-container">

        <div class="service-card">
            <img src="images/web.png" alt="">
            <h3>Web Development</h3>
            <p>I build responsive and modern websites using HTML, CSS and JavaScript.</p>
        </div>

        <div class="service-card">
            <img src="images/design.png" alt="">
            <h3>UI/UX Design</h3>
            <p>I design clean and user-friendly interfaces for better user experience.</p>
        </div>

        <div class="service-card">
            <img src="images/app.png" alt="">
            <h3>Web Applications</h3>
            <p>I create interactive web apps like search tools and automation systems.</p>
        </div>

    </div>

</section>

<script>
    var icon = document.getElementById("icon");

// 👉 Load saved theme when page opens
if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-theme");
    icon.src = "images/pic19.png";
}else{
    document.body.classList.remove("dark-theme");
    icon.src = "images/pic18.png";
}

// 👉 Toggle theme on click
icon.onclick = function(){
    document.body.classList.toggle("dark-theme");

    if(document.body.classList.contains("dark-theme")){
        icon.src = "images/pic19.png";
        localStorage.setItem("theme", "dark");   // save
    }else{
        icon.src = "images/pic18.png";
        localStorage.setItem("theme", "light");  // save
    }
}

</script>
</body>
</html>
